<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <!--
      The bar's brand mark, reframed for a 16px tab.

      Same diamond, same keyhole, same two colours as PATHS.brand in
      ui/icons.js, but scaled out from 10.1 to 11 half-diagonal so the shape
      reaches the edge of the canvas. A favicon has no wordmark beside it to
      share the space with, and the padding the bar mark needs would only
      shrink the one thing a tab has room to show: the silhouette.

      Two layers from the original are gone rather than shrunk. The 8% white
      facet highlight and the half-opacity seam over the top edge are both
      sub-pixel at this size. They survive only as a faint dirtying of the red,
      which costs contrast against the gold and gives nothing back.

      The keyhole keeps its odd construction: a gold copy underneath, fattened
      by its own stroke rather than outlined, with the black shape laid over
      it. Stroking it directly would trace the seam where the round head meets
      the flared base straight through the middle of the silhouette.

      (No double hyphens anywhere in here. This is XML, and a pair of them
      inside a comment is a parse error rather than a style question.)
    -->
    <path d="M12 1 23 12 12 23 1 12Z" fill="#8E2B22" stroke="#C8A44B" stroke-width="1.7"/>
    <g fill="#C8A44B" stroke="#C8A44B" stroke-width="1.6" stroke-linejoin="round">
        <circle cx="12" cy="9.5" r="3"/>
        <path d="M12 10.8 15.27 18.43H8.73z"/>
    </g>
    <g fill="#0E0D0C" stroke="none">
        <circle cx="12" cy="9.5" r="3"/>
        <path d="M12 10.8 15.27 18.43H8.73z"/>
    </g>
</svg>
